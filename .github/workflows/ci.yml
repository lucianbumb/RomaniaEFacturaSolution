name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    # GitHub-hosted deliberately: this repo is public (so hosted minutes are free), and a hosted
    # run is the only proof the package builds on a clean machine. The self-hosted cwe-* runners
    # are repository-scoped to another repository and cannot serve this one.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RomaniaEFacturaSolution.sln

      - name: Build
        run: dotnet build RomaniaEFacturaSolution.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RomaniaEFacturaSolution.sln --no-build --configuration Release --verbosity normal

      - name: Fail on vulnerable packages
        run: |
          dotnet list RomaniaEFacturaSolution.sln package --vulnerable --include-transitive \
            | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable package references found"
            exit 1
          fi
